name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · test · lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # allowScripts nằm trong package.json nên native module (better-sqlite3,
      # argon2) và esbuild build được mà không cần thao tác tay.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit test
        run: npm test

      - name: Ràng buộc phụ thuộc (core/ và progress/ sạch)
        run: npm run lint:imports

  tier1-build:
    name: tier1-build (xóa Tier 2 rồi build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Fail = Tier 2 đã rò rỉ vào Tier 1. Xem STRUCTURE.md §4.
      - run: npm run check:tier1
